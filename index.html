<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bé Học Vui">
<meta name="theme-color" content="#7ec8ff">
<meta name="format-detection" content="telephone=no">
<title>Bé Học Vui</title>
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Màn hình chính -->
<section id="home" class="screen active">
  <div class="home-title">
    <h1>Bé Học Vui</h1>
    <p>Chọn trò chơi nhé!</p>
  </div>
  <div class="menu">
    <button class="menu-card c1" data-game="opposite">
      <span class="menu-art" id="art-opposite"></span>
      <span class="menu-label">Tìm vật</span>
    </button>
    <button class="menu-card c2" data-game="samediff">
      <span class="menu-art" id="art-samediff"></span>
      <span class="menu-label">Giống hay Khác?</span>
    </button>
    <button class="menu-card c3" data-game="findpair">
      <span class="menu-art" id="art-findpair"></span>
      <span class="menu-label">Tìm 2 tranh</span>
    </button>
  </div>
  <p id="voice-warning" class="voice-warning hidden"></p>
</section>

<!-- Màn hình chơi -->
<section id="play" class="screen">
  <header class="topbar">
    <button id="btn-home" class="round-btn" aria-label="Về trang chủ">
      <svg viewBox="0 0 48 48"><path d="M8 24 L24 9 L40 24" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 22 V39 H35 V22" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><rect x="20" y="28" width="8" height="11" fill="#fff"/></svg>
    </button>
    <div class="stars" id="stars"><span class="star-icon">★</span><span id="star-count">0</span></div>
    <button id="btn-speak" class="round-btn" aria-label="Đọc lại câu hỏi">
      <svg viewBox="0 0 48 48"><path d="M8 18 H16 L27 9 V39 L16 30 H8 Z" fill="#fff"/><path d="M32 17 Q37 24 32 31" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M36 12 Q45 24 36 36" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>
    </button>
  </header>
  <div id="question" class="question"></div>
  <div id="stage" class="stage"></div>
  <div id="answers" class="answers hidden">
    <button class="answer-btn same" data-answer="same"><span class="answer-sign">=</span>Giống</button>
    <button class="answer-btn diff" data-answer="diff"><span class="answer-sign">≠</span>Khác</button>
  </div>
</section>

<canvas id="fx"></canvas>

<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/fx.js"></script>
<script src="js/games.js"></script>
<script src="js/app.js"></script>
</body>
</html>
